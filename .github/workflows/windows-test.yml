name: windows-test

on:
  workflow_call:

jobs:
  test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Run SyncClipboard.Test
        run: dotnet test src/SyncClipboard.Test --configuration Release --blame-hang-timeout 2m
      - name: Run SyncClipboard.Test.Desktop
        run: dotnet test src/SyncClipboard.Test.Desktop --configuration Release --blame-hang-timeout 2m
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Build WinUI tests
        run: >-
          msbuild src/SyncClipboard.Test.WinUI3/SyncClipboard.Test.WinUI3.csproj -restore
          /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:Configuration=Release
          /p:WindowsAppSDKSelfContained=true /v:m
      - name: Run WinUI tests
        run: >-
          dotnet test src/SyncClipboard.Test.WinUI3 --configuration Release --runtime win-x64
          -p:Platform=x64 -p:WindowsAppSDKSelfContained=true --no-build --no-restore --blame-hang-timeout 2m
