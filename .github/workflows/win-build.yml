name: win-build

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        cpu: [x64, arm64]
        dotnet_runtime: [self-contained, no-self-contained]
        win_app_sdk: ['win_app_sdk', 'no_win_app_sdk']
        include:
          - cpu: x64
            runner: windows-2025-vs2026
          - cpu: arm64
            runner: windows-11-arm
          - dotnet_runtime: 'self-contained'
            if_self: 'true'
            dotnet_runtime_filename: ''
          - dotnet_runtime: 'no-self-contained'
            dotnet_runtime_filename: '_no-dotnet-runtime'
            if_self: 'false'
          - win_app_sdk: 'win_app_sdk'
            if_app_sdk: 'true'
            win_app_sdk_filename: ''
          - win_app_sdk: 'no_win_app_sdk'
            if_app_sdk: 'false'
            win_app_sdk_filename: '_no-win-app-sdk'

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Install dependencies
      working-directory: ./src
      run: dotnet restore SyncClipboard.WinUI3

    - name: Check updater RID for solution platforms
      if: matrix.cpu == 'x64' && matrix.dotnet_runtime == 'self-contained' && matrix.win_app_sdk == 'win_app_sdk'
      shell: pwsh
      run: |
        foreach ($project in 'SyncClipboard.WinUI3', 'SyncClipboard.Desktop.Default') {
          foreach ($architecture in 'x64', 'ARM64') {
            $rid = dotnet msbuild "src/$project/$project.csproj" -t:ResolveUpdaterConfiguration -p:RuntimeIdentifier= "-p:Platform=$architecture" -getProperty:_UpdaterRid
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve updater RID for $project/$architecture" }
            $expected = "win-$($architecture.ToLowerInvariant())"
            if (($rid -join "`n").Trim() -ne $expected) { throw "Expected $expected for $project/$architecture, got $rid" }
          }
        }

      # msbuild src\SyncClipboard.WinUI3\SyncClipboard.WinUI3.csproj /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:Configuration=Release /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /v:m -restore
    - name: Build SyncClipboard.WinUI3
      run: >
        msbuild
        src\SyncClipboard.WinUI3\SyncClipboard.WinUI3.csproj
        /p:Platform=${{ matrix.cpu }}
        /p:RuntimeIdentifier=win-${{ matrix.cpu }}
        /p:Configuration=Release
        /p:WindowsAppSDKSelfContained=${{ matrix.if_app_sdk }}
        /p:SelfContained=${{ matrix.if_self }}
        /v:m -restore

    - name: copy SyncClipboard.WinUI3
      run: xcopy src\SyncClipboard.WinUI3\bin\${{ matrix.cpu }}\Release\net10.0-windows10.0.19041.0\win-${{ matrix.cpu }} WinUI3\ /s /e

    - name: Install Windows App SDK for framework-dependent checks
      if: matrix.win_app_sdk == 'no_win_app_sdk'
      shell: pwsh
      run: |
        $assets = Get-Content src/SyncClipboard.WinUI3/obj/project.assets.json -Raw | ConvertFrom-Json -AsHashtable
        $runtime = @($assets.libraries.Keys | Where-Object { $_ -like 'Microsoft.WindowsAppSDK.Runtime/*' })
        if ($runtime.Count -ne 1) { throw 'Could not resolve the Windows App SDK runtime package.' }
        $package = Join-Path $env:USERPROFILE ".nuget/packages/$($runtime[0].ToLowerInvariant())/tools/MSIX/win10-${{ matrix.cpu }}"
        $framework = @(Get-ChildItem $package -Filter '*.msix' | Where-Object { $_.Name -match '^Microsoft\.WindowsAppRuntime\.\d+\.msix$' })
        if ($framework.Count -ne 1) { throw 'Could not locate the runtime framework MSIX.' }
        $packages = @($framework[0]) + @(Get-ChildItem $package -Filter '*.msix' | Where-Object { $_.Name -ne $framework[0].Name })
        foreach ($msix in $packages) {
          $archive = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $reader = [IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
            try { $identity = ([xml]$reader.ReadToEnd()).Package.Identity } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          $installed = Get-AppxPackage -Name $identity.Name | Where-Object {
            $_.Architecture -eq $identity.ProcessorArchitecture -and [version]$_.Version -ge [version]$identity.Version
          }
          if (!$installed) { Add-AppxPackage -Path $msix.FullName }
        }

    - name: Publish disposable application for updater restart checks
      run: dotnet publish src/SyncClipboard.Test.UpdaterHost -c Release -r win-${{ matrix.cpu }} -o "${{ runner.temp }}/updater-test-host"

    - name: Check WinUI updater and ZIP installation
      timeout-minutes: 5
      shell: pwsh
      run: |
        $env:SYNC_CLIPBOARD_UPDATER_TEST_EXE = (Resolve-Path WinUI3/SyncClipboard.Updater.exe).Path
        $env:SYNC_CLIPBOARD_UPDATER_TEST_APP = Join-Path $env:RUNNER_TEMP 'updater-test-host/SyncClipboard.exe'
        dotnet test src/SyncClipboard.Test -c Release --filter 'FullyQualifiedName~NativeUpdaterTests.NativeAotUpdater' -m:1
        if ($LASTEXITCODE -ne 0) { throw 'WinUI updater integration checks failed.' }

    - name: set update info
      shell: bash
      run: |
        chmod +x ./build/SetUpdateSource.sh
        ./build/SetUpdateSource.sh -m manual -s github -o WinUI3 -n win_${{ matrix.cpu }}${{ matrix.dotnet_runtime_filename }}${{ matrix.win_app_sdk_filename }}

    - name: Upload build artifacts SyncClipboard.WinUI3
      uses: actions/upload-artifact@v7
      with:
        name: win_${{ matrix.cpu }}${{ matrix.dotnet_runtime_filename }}${{ matrix.win_app_sdk_filename }}
        path: WinUI3/
