name: linux-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: Install appimagetool for real AppImage fixtures
        run: |
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage" \
            --output "$tool"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum --check
          chmod +x "$tool"
          echo "SYNC_CLIPBOARD_APPIMAGE_TEST_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Install Avalonia display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libice6 libsm6 libx11-6 libfontconfig1 libgl1
      - name: Run SyncClipboard.Test
        run: dotnet test src/SyncClipboard.Test --configuration Release --blame-hang-timeout 2m
      - name: Run SyncClipboard.Test.Desktop
        run: xvfb-run -a dotnet test src/SyncClipboard.Test.Desktop --configuration Release --blame-hang-timeout 2m
