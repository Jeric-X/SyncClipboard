name: build

permissions:
    contents: write
on:
  push:
    branches:
      - master
      - ci
      - dev
    tags: 
      - 'v*'

jobs:
  code-style:
    uses: ./.github/workflows/code-style.yml

  prebuild:
    uses: ./.github/workflows/prebuild.yml
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}

  build-win:
    needs: prebuild
    uses: ./.github/workflows/win-release.yml

  build-server:
    uses: ./.github/workflows/server-release.yml
    secrets: inherit

  build-linux:
    needs: prebuild
    uses: ./.github/workflows/linux-release.yml
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}
    
  build-mac:
    needs: prebuild
    uses: ./.github/workflows/mac-release.yml
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}
  
  create-gh-release-draft:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/release-draft.yml

  create-gh-release-formal:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [create-gh-release-draft, build-win, build-server, build-linux, build-mac, windows-test, macos-test, linux-test, windows-updater-smoke-test, macos-updater-smoke-test, linux-updater-smoke-test]
    uses: ./.github/workflows/release-formal.yml

  update-homebrew:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'beta') && github.repository == 'Jeric-X/SyncClipboard' }}
    needs: create-gh-release-formal
    uses: ./.github/workflows/homebrew-release.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  submit-winget:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'beta') && github.repository == 'Jeric-X/SyncClipboard' }}
    needs: create-gh-release-formal
    uses: ./.github/workflows/winget-release.yml
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

  windows-test:
    uses: ./.github/workflows/windows-test.yml

  windows-updater-smoke-test:
    needs: build-win
    uses: ./.github/workflows/windows-updater-smoke-test.yml

  macos-test:
    uses: ./.github/workflows/macos-test.yml

  macos-updater-smoke-test:
    needs: build-mac
    uses: ./.github/workflows/macos-updater-smoke-test.yml

  linux-test:
    uses: ./.github/workflows/linux-test.yml

  linux-updater-smoke-test:
    needs: build-linux
    uses: ./.github/workflows/linux-updater-smoke-test.yml
