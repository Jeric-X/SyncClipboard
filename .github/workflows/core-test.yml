name: core-test

on:
  workflow_call:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info

    - name: Restore dependencies
      run: dotnet restore src/SyncClipboard.Test/SyncClipboard.Test.csproj

    - name: Run Core tests
      run: dotnet test src/SyncClipboard.Test/SyncClipboard.Test.csproj --configuration Release --no-restore --logger trx --results-directory TestResults/core

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install verification dependencies
      run: python -m pip install -r build/verification/requirements.txt

    - name: Verify Core test coverage
      run: python build/verification/check_test_results.py TestResults/core --minimum 356

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: core-test-results
        path: TestResults/core

  desktop-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info
    - name: Test desktop services without UI
      run: dotnet test src/SyncClipboard.Test.Desktop -c Release --filter TestCategory=NonUI --logger trx --results-directory TestResults/desktop
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install verification dependencies
      run: python -m pip install -r build/verification/requirements.txt
    - name: Verify non-UI test coverage
      run: python build/verification/check_test_results.py TestResults/desktop --minimum 4
    - name: Compile the alternative Windows entry point
      if: runner.os == 'Windows'
      run: dotnet build src/SyncClipboard.Desktop.Default -c Release -f net10.0-windows10.0.17763.0
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: desktop-test-results-${{ matrix.os }}
        path: TestResults/desktop

  s3-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
        cache: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Build pinned MinIO test server
      env:
        GOBIN: ${{ runner.temp }}/s3-tools
      run: go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
    - name: Build the non-UI S3 protocol probe
      run: dotnet build build/verification/S3Probe/S3Probe.csproj -c Release
    - name: Verify S3 operations and fault recovery against MinIO
      run: >-
        python build/verification/s3_smoke.py
        --minio "${{ runner.temp }}/s3-tools/minio"
        --probe build/verification/S3Probe/bin/Release/net10.0/S3Probe.dll
        --report s3-test-result.json
    - name: Upload S3 verification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: s3-test-results
        path: s3-test-result.json
        if-no-files-found: error

  winui-test:
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info
    - uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    - name: Build WinUI tests
      run: msbuild src\SyncClipboard.Test.WinUI3\SyncClipboard.Test.WinUI3.csproj /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:Configuration=Release /p:WindowsAppSDKSelfContained=true /p:SelfContained=false /v:m -restore
    - name: Test WinUI services without UI
      run: dotnet test src/SyncClipboard.Test.WinUI3 -c Release --no-build --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --filter TestCategory=NonUI --logger trx --results-directory TestResults/winui
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install verification dependencies
      run: python -m pip install -r build/verification/requirements.txt
    - name: Verify non-UI test coverage
      run: python build/verification/check_test_results.py TestResults/winui --minimum 6
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: winui-test-results
        path: TestResults/winui
