name: core-test

on:
  workflow_call:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.302

    - name: Restore dependencies
      run: dotnet restore src/SyncClipboard.Test/SyncClipboard.Test.csproj

    - name: Publish NativeAOT updater for integration tests
      run: dotnet publish src/SyncClipboard.Updater/SyncClipboard.Updater.csproj -c Release -r win-x64 -o "${{ runner.temp }}/native-updater"

    - name: Run Core tests
      env:
        SYNC_CLIPBOARD_UPDATER_TEST_EXE: ${{ runner.temp }}/native-updater/SyncClipboard.Updater.exe
      run: dotnet test src/SyncClipboard.Test/SyncClipboard.Test.csproj --configuration Release --no-restore
