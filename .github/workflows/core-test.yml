name: core-test

on:
  workflow_call:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.302

    - name: Restore dependencies
      run: dotnet restore src/SyncClipboard.Test/SyncClipboard.Test.csproj

    - name: Run Core tests
      run: >-
        dotnet test src/SyncClipboard.Test/SyncClipboard.Test.csproj --configuration Release --no-restore
        --filter "TestCategory!=PlatformWindows&TestCategory!=PlatformMacOS&TestCategory!=PlatformLinux"

  avalonia-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.302

    - name: Restore Desktop test dependencies
      run: dotnet restore src/SyncClipboard.Test.Desktop/SyncClipboard.Test.Desktop.csproj

    - name: Run Desktop tests including Avalonia Headless
      run: >-
        dotnet test src/SyncClipboard.Test.Desktop/SyncClipboard.Test.Desktop.csproj
        --configuration Release --no-restore --blame-hang-timeout 2m
