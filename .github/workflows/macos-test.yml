name: macos-test

on:
  workflow_call:

jobs:
  function-test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302
      - name: function-test
        run: >-
          dotnet test src/SyncClipboard.Test --configuration Release --arch arm64
          --filter 'TestCategory=PlatformMacOS&TestCategory!=UpdaterSmoke'
          --blame-hang-timeout 2m
      - uses: actions/download-artifact@v8
        with:
          name: SyncClipboard_macos_arm64.dmg
          path: application
      - name: Mount the packaged application
        run: |
          mkdir -p "$RUNNER_TEMP/updater-dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/updater-dmg" "application/SyncClipboard_macos_arm64.dmg"
          echo "SYNC_CLIPBOARD_UPDATER_TEST_SOURCE=$RUNNER_TEMP/updater-dmg/SyncClipboard.app" >> "$GITHUB_ENV"
      - name: smoke-test
        run: >-
          dotnet test src/SyncClipboard.Test --configuration Release --arch arm64 --no-build
          --filter 'TestCategory=PlatformMacOS&TestCategory=UpdaterSmoke'
          --blame-hang-timeout 2m
      - name: Unmount the application
        if: always()
        run: |
          if mount | grep -F " on $RUNNER_TEMP/updater-dmg ("; then
            hdiutil detach "$RUNNER_TEMP/updater-dmg"
          fi
