name: server-build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.302

    - name: Install dependencies
      working-directory: ./src
      run: dotnet restore SyncClipboard.Server

    - name: Build SyncClipboard.Server
      run: dotnet publish src/SyncClipboard.Server/SyncClipboard.Server.csproj --configuration Release --no-restore

    - name: copy SyncClipboard.Server
      run: |
        mkdir server
        cp -r src/SyncClipboard.Server/bin/Release/net10.0/publish/ server/

    - name: Verify first-start configuration and restart
      run: python3 build/verification/server_startup_smoke.py --server-dll server/publish/SyncClipboard.Server.dll

    - name: Upload build artifacts SyncClipboard.Server
      uses: actions/upload-artifact@v7
      with:
        name: SyncClipboard.Server
        path: server/

  container-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Build server container on the native architecture
      run: docker build -f src/SyncClipboard.Server/Dockerfile -t syncclipboard-runtime-check src
    - name: Verify container architecture and show runtime
      run: |
        test "$(docker run --rm --entrypoint uname syncclipboard-runtime-check -m)" = "$(uname -m)"
        docker run --rm --entrypoint dotnet syncclipboard-runtime-check --info
    - name: Verify first-start configuration and restart
      run: python3 build/verification/server_startup_smoke.py --container syncclipboard-runtime-check
