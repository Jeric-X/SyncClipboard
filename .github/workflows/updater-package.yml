name: updater-package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-repo:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025-vs2026
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-26
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout-repo || github.repository }}
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux native toolchain and desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libice6 libsm6 libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libfontconfig1 xvfb xauth
      - name: Publish and check standalone updater
        run: python build/updater/package.py --rid ${{ matrix.rid }}
      - name: Check code style
        if: matrix.rid == 'linux-x64'
        run: dotnet format src/SyncClipboard.Updater/SyncClipboard.Updater.csproj --verify-no-changes --severity info
      - name: Upload updater directory, size report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.rid }}
          path: |
            artifacts/updater/${{ matrix.rid }}/delivery/
            artifacts/updater/${{ matrix.rid }}/report.json
            artifacts/updater/${{ matrix.rid }}/*.log
