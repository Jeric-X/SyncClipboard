name: code-style

on:
  workflow_call:

jobs:
  check:
    runs-on: macos-26  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Install dependencies
      working-directory: ./src
      run: |
        dotnet workload install macos --version 10.0.302.1
        dotnet workload restore
        dotnet restore

    - name: Check code style info
      working-directory: ./src
      run: |
        dotnet format --verify-no-changes --severity info --no-restore --exclude-diagnostics CS0103

  check-windows:
    runs-on: windows-2025-vs2026
    env:
      Configuration: Debug
      Platform: x64
      RuntimeIdentifier: win-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Generate WinUI XAML code
      run: msbuild src\SyncClipboard.Test.WinUI3\SyncClipboard.Test.WinUI3.csproj /restore /v:m

    - name: Check Windows code style info
      working-directory: ./src
      run: dotnet format --verify-no-changes --severity info --no-restore --include SyncClipboard.WinUI3/ SyncClipboard.Test.WinUI3/
