name: code-style

on:
  workflow_call:

jobs:
  check:
    runs-on: macos-26  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info

    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Install dependencies
      working-directory: ./src
      run: |
        dotnet workload install macos --version 10.0.302.1
        dotnet workload restore
        dotnet restore

    - name: Check code style info
      working-directory: ./src
      run: |
        dotnet build SyncClipboard.Core/SyncClipboard.Core.csproj --no-restore
        dotnet format --verify-no-changes --severity info --no-restore

    - name: Check control-statement style in platform branches
      working-directory: ./src
      run: |
        # Core selects WINDOWS/MACOS/LINUX using RuntimeIdentifier; check each branch.
        for runtime in win-x64 osx-arm64 linux-x64; do
          RuntimeIdentifier="$runtime" dotnet format style SyncClipboard.Core/SyncClipboard.Core.csproj \
            --diagnostics IDE2001 --verify-no-changes --no-restore
        done
