name: linux-package

on:
  workflow_call:
    inputs:
      checkout-repo:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/linux-compile.yml
    with:
      checkout-repo: ${{ inputs.checkout-repo }}
      checkout-ref: ${{ inputs.checkout-ref }}

  package-linux:
    strategy:
      matrix:
        cpu: [x64, arm64]
        type: [self-contained, no-self-contained]
        package-type: [AppImage, rpm, deb]
        include:
          - package-type: AppImage
            cpu: x64
            package-head: SyncClipboard-
            package-tail: .x86_64
          - package-type: rpm
            cpu: x64
            package-head: syncclipboard_
            package-tail: .x86_64
          - package-type: deb
            cpu: x64
            package-head: syncclipboard_
            package-tail: _amd64
          - package-type: AppImage
            cpu: arm64
            package-head: SyncClipboard-
            package-tail: .aarch64
          - package-type: deb
            cpu: arm64
            package-head: syncclipboard_
            package-tail: _arm64
          # - package-type: rpm
          #   cpu: arm64
          #   package-head: syncclipboard_
          #   package-tail: .arm64
          - type: self-contained
            package-dotnet-runtime: ''
          - type: no-self-contained
            package-dotnet-runtime: '_no-dotnet-runtime'
        exclude: # rpmbuild arm64 failed https://github.com/kuiperzone/PupNet-Deploy/issues/3
          - package-type: rpm
            cpu: arm64

    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout-repo }}
          ref: ${{ inputs.checkout-ref }}

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Show selected SDK
        run: dotnet --info

      - name: Download last-job-built artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.cpu }}-${{ matrix.type }}
          path: linux-bin/

      - name: Restore updater executable permission
        run: chmod +x linux-bin/SyncClipboard.Updater

      - name: set update info
        run: |
          chmod +x ./build/SetUpdateSource.sh
          ./build/SetUpdateSource.sh -m manual -s github -o linux-bin -n SyncClipboard_linux_${{ matrix.cpu }}${{ matrix.package-dotnet-runtime }}.${{ matrix.package-type }}

      - name: Download last-job-built change log
        uses: actions/download-artifact@v8
        with:
          name: feature

      - name: Install PupNet
        run: dotnet tool install -g KuiperZone.PupNet --version 1.10.0

      - name: Install appimagetool
        if: matrix.package-type == 'AppImage'
        run: |
          # The packaging host is x64, including when packaging the arm64 payload.
          tool_dir="$RUNNER_TEMP/appimagetool"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$tool_dir/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool_dir/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x "$tool_dir/appimagetool-x86_64.AppImage"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install zsync
        if: matrix.package-type == 'AppImage' && matrix.type == 'self-contained'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsync

      - name: Package
        env:
          APPIMAGE_UPDATES: ${{ matrix.type == 'self-contained' }}
        run: >
          chmod +x package.sh &&
          ./package.sh
          -k ${{ matrix.package-type }}
          -r linux-${{ matrix.cpu }}
          -s ../../linux-bin/
        working-directory: ./build/linux

      - name: rename package
        run: >
          mv ${{ matrix.package-head }}*-*${{ matrix.package-tail }}.${{ matrix.package-type }}
          SyncClipboard_linux_${{ matrix.cpu }}${{ matrix.package-dotnet-runtime }}.${{ matrix.package-type }}
        working-directory: ./build/linux/output

      - name: Generate and verify AppImage update metadata
        if: matrix.package-type == 'AppImage' && matrix.type == 'self-contained'
        env:
          APPIMAGE_NAME: SyncClipboard_linux_${{ matrix.cpu }}.AppImage
        run: |
          # Generate after renaming so both Filename and URL match the release asset.
          zsyncmake -u "$APPIMAGE_NAME" "$APPIMAGE_NAME"
          test -s "$APPIMAGE_NAME.zsync"
          readelf --string-dump=.upd_info "$APPIMAGE_NAME" | grep -F -- "$APPIMAGE_UPDATE_INFORMATION"
          grep -aFx "Filename: $APPIMAGE_NAME" "$APPIMAGE_NAME.zsync"
          grep -aFx "URL: $APPIMAGE_NAME" "$APPIMAGE_NAME.zsync"
          checksum=$(sha1sum "$APPIMAGE_NAME" | cut -d ' ' -f 1)
          grep -aFx "SHA-1: $checksum" "$APPIMAGE_NAME.zsync"
        working-directory: ./build/linux/output

      - name: Upload build artifacts ${{ matrix.type }} ${{ matrix.package-type }}
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard_linux_${{ matrix.cpu }}${{ matrix.package-dotnet-runtime }}.${{ matrix.package-type }}
          path: build/linux/output/SyncClipboard_linux_${{ matrix.cpu }}${{ matrix.package-dotnet-runtime }}.${{ matrix.package-type }}

      - name: Upload AppImage update artifact
        if: matrix.package-type == 'AppImage' && matrix.type == 'self-contained'
        uses: actions/upload-artifact@v7
        with:
          name: SyncClipboard_linux_${{ matrix.cpu }}.AppImage.zsync
          path: build/linux/output/SyncClipboard_linux_${{ matrix.cpu }}.AppImage.zsync
          if-no-files-found: error
