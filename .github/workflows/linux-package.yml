name: linux-package

on:
  workflow_call:
    inputs:
      checkout-repo:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/linux-compile.yml
    with:
      checkout-repo: ${{ inputs.checkout-repo }}
      checkout-ref: ${{ inputs.checkout-ref }}

  package-linux:
    strategy:
      matrix:
        cpu: [x64, arm64]
        type: [self-contained, no-self-contained]
        package-type: [AppImage, rpm, deb]
        exclude: # rpmbuild arm64 failed https://github.com/kuiperzone/PupNet-Deploy/issues/3
          - package-type: rpm
            cpu: arm64
          - package-type: AppImage
            type: no-self-contained

    # Native dependency discovery must run on the payload's architecture.
    runs-on: ${{ matrix.cpu == 'arm64' && matrix.package-type == 'AppImage' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout-repo }}
          ref: ${{ inputs.checkout-ref }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.cpu }}-${{ matrix.type }}
          path: linux-bin/

      - name: Install .NET
        if: matrix.package-type != 'AppImage'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install packaging dependencies
        run: bash build/linux/install-dependencies.sh '${{ matrix.package-type }}'

      - name: Package
        id: package
        run: >-
          bash build/linux/package.sh
          -k '${{ matrix.package-type }}'
          -r 'linux-${{ matrix.cpu }}'
          -t '${{ matrix.type }}'
          -s linux-bin

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: build/linux/output/${{ steps.package.outputs.artifact-name }}
          if-no-files-found: error

      - name: Upload update metadata
        if: steps.package.outputs.update-artifact-name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.update-artifact-name }}
          path: build/linux/output/${{ steps.package.outputs.update-artifact-name }}
          if-no-files-found: error
