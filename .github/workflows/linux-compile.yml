name: linux-compile

on:
  workflow_call:
    inputs:
      checkout-repo:
        required: true
        type: string
      checkout-ref:
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        cpu: [x64, arm64]
        type: [self-contained, no-self-contained]
        include:
           - cpu: x64
             runner: ubuntu-24.04
           - cpu: arm64
             runner: ubuntu-24.04-arm
           - type: self-contained
             ifSelf: "true"
           - type: no-self-contained
             ifSelf: "false"

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.checkout-repo }}
        ref: ${{ inputs.checkout-ref }}

    # Install the .NET workload
    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.302

    - name: Show selected SDK
      run: dotnet --info

    - name: Install native toolchain and desktop libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libice6 libsm6 libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libfontconfig1 xvfb xauth

    - name: Build linux-${{ matrix.cpu }}-${{ matrix.type }}
      run: >-
        dotnet publish src/SyncClipboard.Desktop.Default/SyncClipboard.Desktop.Default.csproj
        -f net10.0 -r linux-${{ matrix.cpu }} -c Release
        -p:Platform=${{ matrix.cpu }} --self-contained ${{ matrix.ifSelf }}
        -o linux-${{ matrix.cpu }}-${{ matrix.type }}

    - name: Check updater with the application's native libraries
      timeout-minutes: 2
      run: |
        check_dir="$RUNNER_TEMP/更新 helper 含空格"
        app_dir="$GITHUB_WORKSPACE/linux-${{ matrix.cpu }}-${{ matrix.type }}"
        mkdir -p "$check_dir"
        cp "$app_dir/SyncClipboard.Updater" "$app_dir/libSkiaSharp.so" "$app_dir/libHarfBuzzSharp.so" "$check_dir/"
        chmod +x "$check_dir/SyncClipboard.Updater"
        cd "$RUNNER_TEMP"
        xvfb-run -a "$check_dir/SyncClipboard.Updater" --smoke-test | tee updater-smoke.log
        grep -q 'GUI_SMOKE=PASS' updater-smoke.log

    - name: Upload linux-${{ matrix.cpu }}-${{ matrix.type }}
      uses: actions/upload-artifact@v7
      with:
        name: linux-${{ matrix.cpu }}-${{ matrix.type }}
        path: linux-${{ matrix.cpu }}-${{ matrix.type }}/
