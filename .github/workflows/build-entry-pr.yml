name: build-pr

on:
  pull_request:

jobs:
  code-style:
    uses: ./.github/workflows/code-style.yml

  prebuild:
    uses: ./.github/workflows/prebuild.yml
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}

  build-win:
    uses: ./.github/workflows/win-package.yml
    needs: prebuild

  build-server:
    uses: ./.github/workflows/server-build.yml

  build-linux:
    uses: ./.github/workflows/linux-package.yml
    needs: prebuild
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}
    
  build-mac:
    uses: ./.github/workflows/mac-package.yml
    needs: prebuild
    with:
      checkout-repo: ${{ github.repository }}
      checkout-ref: ${{ github.ref }}

  windows-test:
    uses: ./.github/workflows/windows-test.yml

  windows-updater-smoke-test:
    needs: build-win
    uses: ./.github/workflows/windows-updater-smoke-test.yml

  macos-test:
    uses: ./.github/workflows/macos-test.yml

  macos-updater-smoke-test:
    needs: build-mac
    uses: ./.github/workflows/macos-updater-smoke-test.yml

  linux-test:
    uses: ./.github/workflows/linux-test.yml

  linux-updater-smoke-test:
    needs: build-linux
    uses: ./.github/workflows/linux-updater-smoke-test.yml
